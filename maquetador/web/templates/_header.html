<!-- HEADER HORIZONTAL (compartido) — recibe `pagina_activa` ('dashboard' | 'cursos') -->
<header class="header">
  <div class="header-container">
    <!-- Logo + Brand -->
    <div class="header-logo">
      <img src="{{ url_for('static', filename='img/logo-ucc-white.svg') }}" alt="Universidad Católica de Córdoba" class="logo-img">
      <span class="logo-text">Maquetador</span>
    </div>

    <!-- Nav Items (Desktop) -->
    <nav class="header-nav">
      <a href="{{ url_for('index') }}" class="nav-item {% if pagina_activa == 'dashboard' %}active{% endif %}">Dashboard</a>
      <a href="{{ url_for('cursos') }}" class="nav-item {% if pagina_activa == 'cursos' %}active{% endif %}">Cursos</a>
      <a href="#" class="nav-item">Configuración</a>
    </nav>

    <!-- Right: Theme + Profile -->
    <div class="header-right">
      <select id="tema-selector" class="theme-select">
        <option value="educacion" {% if session.get('tema') == 'educacion' %}selected{% endif %}>Educación</option>
        <option value="posgrado" {% if session.get('tema') == 'posgrado' %}selected{% endif %}>Posgrado</option>
      </select>

      <div class="profile-dropdown">
        <button class="profile-btn">👤 Perfil</button>
      </div>
    </div>

    <!-- Hamburger Menu (Mobile) -->
    <button class="hamburger-menu" id="hamburger-btn">☰</button>
  </div>

  <!-- Mobile Menu (Hidden) -->
  <div class="mobile-menu" id="mobile-menu">
    <nav class="mobile-nav">
      <a href="{{ url_for('index') }}" class="mobile-nav-item">Dashboard</a>
      <a href="{{ url_for('cursos') }}" class="mobile-nav-item">Cursos</a>
      <a href="#" class="mobile-nav-item">Configuración</a>
    </nav>
  </div>
</header>

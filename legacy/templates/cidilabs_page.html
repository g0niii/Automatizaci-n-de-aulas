<!-- 
  Plantilla CIDILABS Nativa (Solo Fragmento para Canvas)
-->
<div id="dp-wrapper" class="dp-wrapper dp-flat-sections-main variation-2">
  
  <!-- Banner de Título -->
  <div class="dp-banner-image" style="text-align: center;">
    {% if banner_url %}
    <img src="{{ banner_url }}" alt="{{ titulo }}" style="width: 100%; max-width: 1100px; height: auto;">
    {% else %}
    <div style="background-color: {{ colors.primary }}; color: white; padding: 40px; text-align: center; border-radius: 4px;">
      <h1 style="font-family: {{ fonts.heading }}; margin: 0;">{{ titulo }}</h1>
      <p style="margin: 5px 0 0 0; opacity: 0.8;">{{ modulo_nombre }}</p>
    </div>
    {% endif %}
  </div>

  <!-- Bloque de Contenido Principal -->
  <div class="dp-content-block">
    <div class="dp-content-inner">
      {{ contenido | safe }}
    </div>
  </div>

  <!-- Pie de Página Institucional (Opcional) -->
  <div class="dp-footer" style="margin-top: 50px; border-top: 1px solid #eee; padding-top: 20px; text-align: center; color: #999; font-size: 0.8em;">
    <p>© Universidad Católica de Córdoba</p>
  </div>
</div>

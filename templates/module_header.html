<!-- 
  Plantilla de cabecera de módulo — Página de presentación/overview.
  Todos los estilos son INLINE para compatibilidad con Canvas LMS.
  Variables: titulo, contenido, modulo_nombre, items_titulos, colors, fonts
-->

<div style="
  font-family: {{ fonts.body }};
  max-width: 900px;
  margin: 0 auto;
  color: {{ colors.text_dark }};
">

  <!-- ====== BANNER DEL MÓDULO ====== -->
  <div style="
    background: linear-gradient(135deg, {{ colors.primary }} 0%, {{ colors.secondary }} 100%);
    border-radius: 16px;
    padding: 40px 36px;
    text-align: center;
    position: relative;
    overflow: hidden;
  ">
    <!-- Patrón decorativo -->
    <div style="
      position: absolute;
      top: -30px;
      right: -30px;
      width: 120px;
      height: 120px;
      border-radius: 50%;
      background: rgba(255,255,255,0.06);
    "></div>
    <div style="
      position: absolute;
      bottom: -40px;
      left: -20px;
      width: 160px;
      height: 160px;
      border-radius: 50%;
      background: rgba(255,255,255,0.04);
    "></div>

    <p style="
      color: {{ colors.accent_light }};
      font-family: {{ fonts.heading }};
      font-size: 12px;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 3px;
      margin: 0 0 12px 0;
    ">{{ modulo_nombre }}</p>

    <h1 style="
      color: {{ colors.bg_white }};
      font-family: {{ fonts.heading }};
      font-size: 32px;
      font-weight: 800;
      margin: 0 0 16px 0;
      line-height: 1.2;
    ">{{ titulo }}</h1>

    {% if contenido %}
    <p style="
      color: rgba(255,255,255,0.85);
      font-size: 16px;
      max-width: 600px;
      margin: 0 auto;
      line-height: 1.6;
    ">{{ contenido }}</p>
    {% endif %}
  </div>

  {% if items_titulos %}
  <!-- ====== ÍNDICE DE CONTENIDOS ====== -->
  <div style="
    background: {{ colors.bg_white }};
    border: 1px solid {{ colors.border }};
    border-radius: 12px;
    padding: 28px 32px;
    margin-top: 24px;
  ">
    <h2 style="
      font-family: {{ fonts.heading }};
      font-size: 20px;
      color: {{ colors.primary }};
      margin: 0 0 20px 0;
      padding-bottom: 12px;
      border-bottom: 2px solid {{ colors.primary_lighter }};
    ">📋 Contenidos del módulo</h2>

    <ol style="
      margin: 0;
      padding: 0;
      list-style: none;
      counter-reset: item;
    ">
      {% for item_titulo in items_titulos %}
      <li style="
        counter-increment: item;
        padding: 12px 16px;
        margin-bottom: 8px;
        background: {{ colors.bg_light }};
        border-radius: 8px;
        border-left: 3px solid {{ colors.primary_light }};
        font-size: 15px;
        color: {{ colors.text_dark }};
        display: flex;
        align-items: center;
        gap: 12px;
      ">
        <span style="
          background: {{ colors.primary }};
          color: {{ colors.bg_white }};
          width: 28px;
          height: 28px;
          border-radius: 50%;
          display: inline-flex;
          align-items: center;
          justify-content: center;
          font-size: 13px;
          font-weight: 700;
          flex-shrink: 0;
        ">{{ loop.index }}</span>
        {{ item_titulo }}
      </li>
      {% endfor %}
    </ol>
  </div>
  {% endif %}

</div>

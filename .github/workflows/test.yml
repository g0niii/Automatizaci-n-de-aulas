name: Tests CI

on:
  push:
    branches: [main, develop, "claude/*"]
  pull_request:
    branches: [main, develop]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.11"]

    steps:
    - uses: actions/checkout@v7
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v7
      with:
        python-version: ${{ matrix.python-version }}

    - name: Cache Python dependencies
      uses: actions/cache@v6
      with:
        path: ~/.cache/pip
        key: ${{ runner.os }}-pip-${{ hashFiles('**/requirements.txt') }}
        restore-keys: |
          ${{ runner.os }}-pip-

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt
        pip install pytest pytest-cov

    - name: Run pytest with coverage
      run: |
        pytest tests/ -v --cov=maquetador --cov-report=term-missing --cov-report=html --cov-report=xml

    # Informe propio: sin servicios externos, sin cuentas ni tokens.
    # Rankea los módulos por líneas sin cubrir (dónde está el riesgo real,
    # no el porcentaje plano) y corta el build si la cobertura baja del piso.
    - name: Informe de cobertura
      if: always()
      run: python scripts/cobertura.py

    - name: Store coverage HTML report
      uses: actions/upload-artifact@v7
      if: always()
      with:
        name: coverage-report-${{ matrix.python-version }}
        path: htmlcov/
        retention-days: 30
